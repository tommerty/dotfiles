#############################################
# Minimal hypridle configuration (pairs with hyprlock)
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#############################################

# Behavior contract:
# 1. After 300s (5m) -> lock (hyprlock) immediately.
# 2. After 330s (5m30s) -> turn off the displays (DPMS off) IF still idle.
# 3. On resume -> wake displays (DPMS on).
# (Optional commented step for suspend after longer idle.)

general {
    ignore_dbus_inhibit = false         # respect apps like video players
    ignore_systemd_inhibit = false
      lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
}

# First tier: lock
listener {
    timeout = 1800                       # seconds of no input
  on-timeout = brightnessctl -s set 10         
  on-resume = brightnessctl -r  
}

# Second tier: power save monitors
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Optional: suspend after e.g. 30 minutes (uncomment to enable)
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
#     on-resume = echo "[hypridle] resume from suspend tier"
# }

# Tips:
#   hyprctl idle inhibit on/off   # temporary manual inhibit
#   dbus portals or video players may inhibit automatically.

