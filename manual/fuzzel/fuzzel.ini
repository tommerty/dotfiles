font=JetBrainsMono Nerd Font
dpi-aware=auto
icon-theme=Papirus
width=50
layer=overlay
line-height=50
fields=name,generic,comment,categories,filename,keywords
terminal=ghostty -e
prompt="❯   "
show-actions=yes
exit-on-keyboard-focus-loss=no
inner-pad=20
match-mode=fzf

[colors]
background=161616ff
text=ffffffff
match=ee5396ff
selection-match=ee5396ff
selection=262626ff
selection-text=33b1ffff
border=525252ff

[border]
radius=18
width=1

[dmenu]
exit-immediately-if-empty=yes
